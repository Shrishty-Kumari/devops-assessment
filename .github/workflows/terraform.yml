name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: What to run
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: "Destroy only: type the environment name to confirm"
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:

  plan:
    if: github.event_name == 'pull_request'
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]

    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive ../..
      - run: terraform init
      - run: terraform validate

      - id: plan
        run: terraform plan -refresh=false -no-color -out=tfplan

      - run: terraform show -no-color tfplan > plan.txt
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan-${{ matrix.env }}
          path: infra/envs/${{ matrix.env }}/plan.txt
          retention-days: 14

      - uses: marocchino/sticky-pull-request-comment@v2
        if: always()
        with:
          header: terraform-plan-${{ matrix.env }}
          message: |
            ### Terraform plan — `${{ matrix.env }}`

            <details><summary>Show plan</summary>

            ```terraform
            ${{ steps.plan.outputs.stdout }}
            ```

            </details>

            _Plan only: no AWS credentials are used and nothing is applied._

  apply:
    if: github.event_name != 'pull_request'
    name: ${{ github.event.inputs.action || 'apply' }} (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment || 'dev' }}

    concurrency: terraform-${{ github.event.inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: infra/envs/${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4


      - name: Confirm destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]; then
            echo "::error::To destroy '${{ github.event.inputs.environment }}'," \
                 "type that name into the confirm box."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - uses: hashicorp/setup-terraform@v3
=
      - run: rm -f backend_override.tf

      - run: terraform init

      - run: terraform validate

      - name: terraform plan
        run: |
          terraform plan -no-color -var plan_only=false -out=tfplan \
            ${{ github.event.inputs.action == 'destroy' && '-destroy' || '' }}

      - name: terraform apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy'
        run: terraform apply -auto-approve tfplan

      - name: terraform output
        if: github.event.inputs.action != 'destroy'
        run: terraform output
